site_name: Legatium
site_description: One structured adapter_* log line per outbound HTTP exchange, where the service sends its envoy
site_url: https://inqudium.github.io/legatium/
repo_url: https://github.com/Inqudium/legatium
repo_name: Inqudium/legatium
edit_uri: edit/main/docs/

theme:
  name: material
  logo: logo/legatium-icon.svg
  favicon: logo/legatium-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

# Internal analysis reports - not site pages (tabellarium template pattern).
exclude_docs: |
  assessment/

nav:
  - Home: index.md
  # The long-form guides live next to their module sources (outside this
  # docs_dir). .github/scripts/generate-guide-pages.py copies them (plus
  # their companion files) under docs/guides/ with rewritten links in the
  # Docs workflow; not checked in - run the script before building
  # locally, or the --strict build fails (which is the guard against a
  # hand-maintained, drifting copy).
  - RestClient guide: guides/legatium-restclient-logging/GUIDE.md
  - WebClient guide: guides/legatium-webclient-logging/GUIDE.md
  - Elasticsearch mapping: elk/README.md
  - Configuration reference: https://github.com/Inqudium/legatium/blob/main/docs/adapter-logging-reference.yml
  # Generated by .github/scripts/generate-test-catalog.py in the Docs
  # workflow (after `mvn verify`); not checked in - run the script before
  # building locally, or the --strict build fails (which is the guard
  # against a hand-maintained, drifting copy).
  - Test evidence: tests/test-evidence.md
  - Coverage report: https://inqudium.github.io/legatium/coverage/
  - API reference (RestClient): https://inqudium.github.io/legatium/api/legatium-restclient-logging/
  - API reference (WebClient): https://inqudium.github.io/legatium/api/legatium-webclient-logging/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Collapsible rationale blocks on the generated test-evidence page.
  - pymdownx.details
  - tables
