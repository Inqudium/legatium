<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Legatium element tile">
  <style>
    :root { --ink:#26221c; --road:#2c5aa0; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e6e1d6; --road:#4f7fd1; } }
    text { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: var(--ink); }
  </style>
  <!-- element tile, the twin of limesium's -->
  <rect x="10" y="10" width="108" height="108" rx="10" fill="none" stroke="var(--ink)" stroke-width="6"/>
  <!-- "atomic number": one line per exchange -->
  <text x="26" y="38" font-size="16" font-weight="600">1</text>
  <!-- element symbol -->
  <text x="64" y="78" font-size="48" font-weight="700" text-anchor="middle">Lg</text>
  <!-- the envoy's road: starts INSIDE the tile and leaves it to the right - outbound, where the limes
       runs through limesium's tile as the frontier -->
  <circle cx="52" cy="92.5" r="6" fill="var(--road)"/>
  <rect x="52" y="90" width="76" height="5" fill="var(--road)"/>
  <path d="M112 84 L122 92.5 L112 101" fill="none" stroke="var(--road)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- element name -->
  <text x="66" y="110" font-size="9.5" letter-spacing="2.5" text-anchor="middle">LEGATIUM</text>
</svg>
